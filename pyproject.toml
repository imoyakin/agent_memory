description = "Project-local vector memory tools for coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6,<7",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true
