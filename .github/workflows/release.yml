name: Release Skill Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: Check source file length
        shell: bash
        run: |
          max_lines=400
          failed=0
          while IFS= read -r file; do
            lines="$(wc -l < "$file")"
            if (( lines > max_lines )); then
              echo "$file has $lines lines; split project-owned source files above $max_lines lines." >&2
              failed=1
            fi
          done < <(git ls-files --cached --others --exclude-standard '*.rs' '*.py' '*.sh')
          exit "$failed"
      - name: Build Rust binary
        run: cargo build --release
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/agent-memory "dist/agent-memory-${{ matrix.platform }}"
          chmod +x "dist/agent-memory-${{ matrix.platform }}"
          (cd dist && shasum -a 256 "agent-memory-${{ matrix.platform }}" > "agent-memory-${{ matrix.platform }}.sha256")
      - name: Smoke test staged assets
        shell: bash
        run: |
          "dist/agent-memory-${{ matrix.platform }}" --help
      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            dist/agent-memory-${{ matrix.platform }}
            dist/agent-memory-${{ matrix.platform }}.sha256
