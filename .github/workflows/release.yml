name: Release Skill Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check source file length
        shell: bash
        run: |
          max_lines=400
          failed=0
          while IFS= read -r file; do
            lines="$(wc -l < "$file")"
            if (( lines > max_lines )); then
              echo "$file has $lines lines; split project-owned source files above $max_lines lines." >&2
              failed=1
            fi
          done < <(git ls-files --cached --others --exclude-standard '*.rs' '*.py' '*.sh')
          exit "$failed"
      - name: Build Rust binary
        run: cargo build --release
      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p dist
          checksum() {
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              sha256sum "$1"
            fi
          }
          if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
            src="target/release/agent-memory.exe"
            asset="agent-memory-windows-x64.exe"
          else
            src="target/release/agent-memory"
            asset="agent-memory-${{ matrix.platform }}"
          fi
          cp "$src" "dist/$asset"
          chmod +x "dist/$asset"
          (cd dist && checksum "$asset" > "$asset.sha256")
          if [[ "${{ matrix.platform }}" == "linux-x64" ]]; then
            package_paths=(SKILL.md README.md Cargo.toml scripts assets references src)
            [[ -d DESIGN ]] && package_paths+=(DESIGN)
            tar -czf dist/agent-memory-skill.tar.gz \
              "${package_paths[@]}"
            (cd dist && shasum -a 256 agent-memory-skill.tar.gz > agent-memory-skill.tar.gz.sha256)
          fi
      - name: Smoke test staged assets
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows-x64" ]]; then
            "dist/agent-memory-windows-x64.exe" --help
          else
            "dist/agent-memory-${{ matrix.platform }}" --help
          fi
      - name: Upload Unix assets
        if: matrix.platform != 'windows-x64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            dist/agent-memory-${{ matrix.platform }}
            dist/agent-memory-${{ matrix.platform }}.sha256
      - name: Upload Windows assets
        if: matrix.platform == 'windows-x64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            dist/agent-memory-windows-x64.exe
            dist/agent-memory-windows-x64.exe.sha256
      - name: Upload skill package
        if: matrix.platform == 'linux-x64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            dist/agent-memory-skill.tar.gz
            dist/agent-memory-skill.tar.gz.sha256
